<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống WebGIS Dự Báo Ngư Trường</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-color: #0b131a;
            --panel-bg: rgba(16, 28, 38, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #e2e8f0;
            --accent-color: #00b4d8;
            --active-color: #2ec4b6;
        }

        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); overflow: hidden; display: flex; flex-direction: column; }

        /* HEADER */
        header { height: 50px; background: #070d12; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 2000; }
        header h1 { margin: 0; font-size: 18px; font-weight: 500; display: flex; align-items: center; gap: 10px; color: #fff; }
        .nav-right { display: flex; gap: 20px; font-size: 13px; color: #a0aec0; }
        .nav-right span { cursor: pointer; display: flex; align-items: center; gap: 6px; transition: color 0.3s; }
        .nav-right span:hover { color: #fff; }

        .main-container { display: flex; flex: 1; height: calc(100% - 50px); position: relative; }

        /* SIDEBAR */
        .sidebar-icons { width: 50px; background: #070d12; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 25px; z-index: 1000; }
        .sidebar-icons i { font-size: 18px; color: #718096; cursor: pointer; transition: color 0.3s; }
        .sidebar-icons i:hover, .sidebar-icons i.active { color: var(--accent-color); }

        /* CONTROL PANEL */
        .control-panel { width: 330px; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 15px; gap: 15px; overflow-y: auto; z-index: 1000; backdrop-filter: blur(5px); }
        .control-panel::-webkit-scrollbar { width: 6px; }
        .control-panel::-webkit-scrollbar-thumb { background-color: #4a5568; border-radius: 10px; }
        
        .section-title { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #718096; margin-bottom: 8px; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; letter-spacing: 0.5px; display: flex; justify-content: space-between; }
        
        .flex-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 6px; }
        
        /* SWITCH BUTTON */
        .switch { position: relative; display: inline-block; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #4a5568; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--active-color); }
        input:checked + .slider:before { transform: translateX(16px); }

        .variable-list { font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
        .var-item { display: flex; justify-content: space-between; }
        .var-val { color: var(--accent-color); font-weight: bold; }

        .chart-box { background: rgba(0,0,0,0.25); border-radius: 6px; padding: 12px; border: 1px solid var(--border-color); }
        .chart-container { height: 100px; position: relative; margin-top: 5px; }

        /* MAP */
        #map { flex: 1; height: 100%; background-color: #000; }

        /* DYNAMIC TABLE OVERLAY */
        .map-overlay-right { position: absolute; top: 15px; right: 15px; width: 290px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 15px; z-index: 1000; font-size: 12px; backdrop-filter: blur(5px); box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .catch-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .catch-table th, .catch-table td { text-align: left; padding: 8px 4px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .catch-table th { color: #718096; font-weight: normal; font-size: 11px; text-transform: uppercase; }
        .catch-table tr { cursor: pointer; transition: background 0.2s; }
        .catch-table tr:hover { background: rgba(0, 180, 216, 0.2); } /* Hiệu ứng hover khi rê chuột vào hàng */
        .catch-table tr.active-row { border-left: 3px solid var(--accent-color); background: rgba(0, 180, 216, 0.15); }

        .map-legend { position: absolute; bottom: 20px; left: 410px; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px 15px; z-index: 1000; font-size: 11px; display: flex; flex-direction: column; gap: 8px; width: 240px; backdrop-filter: blur(5px); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .legend-bar { height: 8px; background: linear-gradient(to right, #00b4d8, #00f5d4, #ffb703, #ff4d6d); border-radius: 4px; }
        .legend-labels { display: flex; justify-content: space-between; color: #a0aec0; text-transform: uppercase; font-weight: bold; font-size: 10px; }
        
        .leaflet-popup-content-wrapper { background: var(--panel-bg) !important; color: var(--text-color) !important; border: 1px solid var(--border-color); box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-radius: 4px; }
        .leaflet-popup-tip { background: var(--panel-bg) !important; }
    </style>
</head>
<body>
    <header>
        <h1><i class="fa-solid fa-globe" style="color: var(--accent-color);"></i> WebGIS Dự Báo Ngư Trường</h1>
        <div class="nav-right">
            <span id="live-time" style="color: var(--active-color); font-weight: bold; margin-right: 15px;"></span>
            <span><i class="fa-solid fa-layer-group"></i> Bản đồ 2D</span>
            <span><i class="fa-solid fa-water"></i> Địa hình biển</span>
            <span><i class="fa-solid fa-user-tie"></i> Lê Gia Kiệt</span>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar-icons">
            <i class="fa-solid fa-house active"></i>
            <i class="fa-solid fa-chart-line"></i>
            <i class="fa-solid fa-magnifying-glass"></i>
            <i class="fa-solid fa-layer-group"></i>
            <i class="fa-solid fa-gear" style="margin-top: auto; margin-bottom: 20px;"></i>
        </div>

        <div class="control-panel">
            <div>
                <div class="section-title">Mô Hình Dự Báo <span id="model-status" style="color: var(--active-color);">Đang chạy</span></div>
                <div class="flex-row">
                    <span>Quét điểm nóng (AI Layer)</span>
                    <!-- Chức năng 1: Gắn ID cho nút Switch để bắt sự kiện -->
                    <label class="switch"><input type="checkbox" id="toggleAI" checked><span class="slider"></span></label>
                </div>
            </div>
            
            <div>
                <div class="section-title">Thông Số Biển (Live)</div>
                <div class="variable-list">
                    <div class="var-item"><span>Nhiệt độ (SST):</span><span class="var-val">28.5°C</span></div>
                    <div class="var-item"><span>Diệp lục (Chl-a):</span><span class="var-val" style="color: #00f5d4;">Cao</span></div>
                </div>
            </div>
            
            <div class="chart-box"><div class="section-title" style="border:0; margin:0;">Biến Động Nhiệt Độ</div><div class="chart-container"><canvas id="chart1"></canvas></div></div>
            <div class="chart-box"><div class="section-title" style="border:0; margin:0;">Xu Hướng Môi Trường</div><div class="chart-container"><canvas id="chart2"></canvas></div></div>
        </div>

        <div id="map"></div>

        <div class="map-overlay-right">
            <div class="section-title">Khu Vực Tiềm Năng Chứa Cá</div>
            <table class="catch-table">
                <thead><tr><th>Mã Trạm</th><th>Tọa Độ (Click để Xem)</th></tr></thead>
                <!-- Chức năng 2: Vùng Body bảng trống để JS tự động đổ dữ liệu vào -->
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div class="map-legend">
            <span style="font-weight: bold; color: #fff; font-size: 12px;"><i class="fa-solid fa-temperature-half"></i> Mật Độ Phân Bố</span>
            <div class="legend-bar"></div>
            <div class="legend-labels"><span>Thấp</span><span>Cao</span></div>
        </div>
    </div>

    <script>
        // --- ĐỒNG HỒ LIVE THỜI GIAN THỰC ---
        function updateTime() {
            var now = new Date();
            document.getElementById('live-time').innerHTML = '<i class="fa-solid fa-clock"></i> ' + now.toLocaleTimeString('vi-VN') + ' - ' + now.toLocaleDateString('vi-VN');
        }
        setInterval(updateTime, 1000);
        updateTime();

        // --- KHỞI TẠO BẢN ĐỒ ---
        var map = L.map('map', {zoomControl: false}).setView([11.5, 110.5], 6);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 }).addTo(map);

        // --- NHÓM LAYER ĐỂ DỄ DÀNG BẬT/TẮT BẰNG NÚT SWITCH ---
        var aiLayerGroup = L.layerGroup().addTo(map); 

        // 1. DỮ LIỆU LƯỚI NHIỆT ĐỘ (Thêm vào nhóm aiLayerGroup)
        var gridFeatures = [];
        for (var lat = 8; lat <= 16; lat += 0.4) { 
            for (var lng = 105; lng <= 114; lng += 0.4) { 
                var isLand = false;
                if (lat >= 14.5 && lng <= 109.0) isLand = true; 
                else if (lat >= 13.0 && lat < 14.5 && lng <= 109.3) isLand = true; 
                else if (lat >= 11.5 && lat < 13.0 && lng <= 109.2) isLand = true; 
                else if (lat >= 10.0 && lat < 11.5 && lng <= 108.5) isLand = true; 
                else if (lat < 10.0 && lng <= 106.8) isLand = true; 
                
                if (!isLand) {
                    gridFeatures.push({
                        "type": "Feature",
                        "properties": { "SST": parseFloat((25 + Math.random() * 5).toFixed(1)) },
                        "geometry": { "type": "Polygon", "coordinates": [[[lng, lat], [lng+0.4, lat], [lng+0.4, lat+0.4], [lng, lat+0.4], [lng, lat]]] }
                    });
                }
            }
        }
        function getSSTColor(d) { return d > 29 ? '#ff4d6d' : d > 28 ? '#ffb703' : d > 27 ? '#00f5d4' : '#00b4d8'; }
        
        L.geoJSON(gridFeatures, {
            style: function(f) { return { fillColor: getSSTColor(f.properties.SST), weight: 0.5, color: 'rgba(255,255,255,0.05)', fillOpacity: 0.4 }; }
        }).addTo(aiLayerGroup); // Đưa lưới vào group

        // 2. DỮ LIỆU ĐIỂM CÁ & CHỨC NĂNG ĐỘNG CHO BẢNG
        var spotData = [
            { id: "TS.55.366°S", name: "Xác suất 85% - Cá Ngừ", lat: 12.3, lng: 110.5, color: "#ff4d6d" },
            { id: "TS.55.365°S", name: "Đàn cá nổi đang di cư", lat: 11.1, lng: 109.5, color: "#00f5d4" },
            { id: "TS.55.369°S", name: "Xác suất 80% - Cá Ngừ", lat: 13.45, lng: 111.15, color: "#ffb703" },
            { id: "TS.55.390°S", name: "Vùng mồi ăn dồi dào", lat: 14.1, lng: 111.8, color: "#00b4d8" }
        ];

        var tableBody = document.getElementById('table-body');
        var markers = {}; // Lưu trữ marker để gọi khi click vào bảng

        spotData.forEach(function(spot, index) {
            // Vẽ điểm lên bản đồ (Thêm vào aiLayerGroup)
            var marker = L.circleMarker([spot.lat, spot.lng], { radius: 8, fillColor: spot.color, color: "#fff", weight: 2, fillOpacity: 0.9 }).addTo(aiLayerGroup);
            marker.bindPopup("<b style='color:"+spot.color+"'><i class='fa-solid fa-fish-fins'></i> " + spot.name + "</b>");
            markers[spot.id] = marker; // Lưu marker theo ID

            // Tạo hàng động (HTML) cho bảng tọa độ
            var tr = document.createElement('tr');
            if(index === 0) tr.className = "active-row"; // Dòng đầu tiên sáng màu mặc định
            tr.innerHTML = `<td>${spot.id}</td><td style="color:${spot.color}; font-weight:bold;">${spot.lng}°E, ${spot.lat}°N</td>`;
            
            // SỰ KIỆN CLICK: Bay đến tọa độ khi nhấn vào hàng trong bảng
            tr.onclick = function() {
                // Xóa sáng các dòng khác, làm sáng dòng vừa click
                document.querySelectorAll('.catch-table tr').forEach(row => row.classList.remove('active-row'));
                tr.classList.add('active-row');
                
                // Nếu lớp AI đang bật, bay bản đồ đến điểm đó và mở popup
                if(document.getElementById('toggleAI').checked) {
                    map.flyTo([spot.lat, spot.lng], 10, { duration: 1.5 }); // Zoom vào mức 10
                    setTimeout(() => { markers[spot.id].openPopup(); }, 1500); // Mở bong bóng thông tin sau khi bay tới nơi
                }
            };
            tableBody.appendChild(tr);
        });

        // 3. SỰ KIỆN BẬT/TẮT NÚT SWITCH (MÔ HÌNH AI)
        document.getElementById('toggleAI').addEventListener('change', function() {
            var statusText = document.getElementById('model-status');
            if (this.checked) {
                map.addLayer(aiLayerGroup); // Hiển thị lại lưới và điểm cá
                statusText.innerText = "Đang chạy";
                statusText.style.color = "var(--active-color)";
            } else {
                map.removeLayer(aiLayerGroup); // Ẩn lưới và điểm cá
                statusText.innerText = "Đã tắt";
                statusText.style.color = "#718096";
                map.closePopup(); // Đóng popup nếu đang mở
            }
        });

        // 4. BIỂU ĐỒ (Giữ nguyên)
        function createMiniChart(canvasId, label, data, color) {
            var ctx = document.getElementById(canvasId).getContext('2d');
            return new Chart(ctx, {
                type: 'line', data: { labels: [1,2,3,4,5,6,7], datasets: [{ label: label, data: data, borderColor: color, backgroundColor: color + '25', fill: true, borderWidth: 2, pointRadius: 0, tension: 0.4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
            });
        }
        createMiniChart('chart1', 'Nhiệt Độ', [25, 26, 25.5, 27, 28.5, 29, 28], '#ffb703');
        createMiniChart('chart2', 'Môi Trường', [30, 45, 40, 65, 75, 70, 85], '#00f5d4');
    </script>
</body>
</html>
